[project]
name = "forest-bot"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.31.0",
    "docx2txt>=0.9",
    "dotenv>=0.9.9",
    "fastembed>=0.9.1",
    "groq>=1.7.0",
    "llama-index>=0.14.25",
    "llama-index-embeddings-fastembed>=0.7.0",
    "llama-index-llms-groq>=0.6.1",
    "llama-index-readers-file>=0.7.0",
    "pymupdf>=2.1",
    "tinydb>=4.9.0",
]

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
preview = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "assert",
    "any-type",
    "magic-value-comparison",
    "unused-function-argument",
    "D",
]
"comments/migrations/*" = ["undocumented-public-class", "mutable-class-default"]
"comments/models.py" = ["django-nullable-model-string-field"]

[tool.ruff.lint]
extend-select = ["ALL"]
ignore = [
    "undocumented-public-init",
    "undocumented-public-module",
    "undocumented-public-package",
    "incorrect-blank-line-before-class",
    "multi-line-summary-first-line",
    "CPY",
    "TC",
    "T20",
    "ERA",
    "DOC",
    "D",
    "any-type",
    "blind-except",
    "missing-trailing-comma", # warning
    "no-self-use", # static-method
    "future-rewritable-type-annotation",
    "ambiguous-unicode-character-string",
    "raise-vanilla-args",
    "try-except-in-loop",
    "unaliased-collections-abc-set-import",
    "try-consider-else",
    "if-else-block-instead-of-if-exp",
    "raw-string-in-exception",
    "explicit-string-concatenation",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
